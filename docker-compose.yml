services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  notification-worker:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      INTERNAL_APP_URL: http://web:3000
    command: ["node", "scripts/notification-worker.mjs"]
    depends_on:
      web:
        condition: service_healthy
