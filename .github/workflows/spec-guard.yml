name: Spec guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-spec-system:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate required specs and feature-spec shape
        run: node scripts/check-specs.mjs
